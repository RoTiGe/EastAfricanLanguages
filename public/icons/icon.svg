<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#667eea"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Speech bubble left (native language) -->
  <rect x="60" y="130" width="180" height="110" rx="20" fill="white" opacity="0.92"/>
  <polygon points="90,240 130,240 90,275" fill="white" opacity="0.92"/>

  <!-- Speech bubble right (target language) -->
  <rect x="272" y="210" width="180" height="110" rx="20" fill="url(#accent)" opacity="0.92"/>
  <polygon points="422,320 382,320 422,355" fill="url(#accent)" opacity="0.92"/>

  <!-- Text lines in left bubble -->
  <rect x="82" y="158" width="120" height="10" rx="5" fill="#667eea" opacity="0.7"/>
  <rect x="82" y="178" width="90" height="10" rx="5" fill="#667eea" opacity="0.5"/>
  <rect x="82" y="198" width="105" height="10" rx="5" fill="#667eea" opacity="0.6"/>

  <!-- Text lines in right bubble -->
  <rect x="294" y="238" width="120" height="10" rx="5" fill="white" opacity="0.85"/>
  <rect x="294" y="258" width="90" height="10" rx="5" fill="white" opacity="0.65"/>
  <rect x="294" y="278" width="105" height="10" rx="5" fill="white" opacity="0.75"/>

  <!-- Bridge / connection arc -->
  <path d="M 240 185 Q 256 155 272 265" stroke="white" stroke-width="5" fill="none" opacity="0.6" stroke-dasharray="8 5"/>

  <!-- "LB" letters at bottom -->
  <text x="256" y="400" font-family="Arial, sans-serif" font-size="80" font-weight="900"
        text-anchor="middle" fill="white" opacity="0.95" letter-spacing="4">LB</text>

  <!-- Tagline -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="22" font-weight="400"
        text-anchor="middle" fill="white" opacity="0.75" letter-spacing="2">LANGUAGE BRIDGE</text>
</svg>

